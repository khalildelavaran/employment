name: Dasteva Recruitment CI/CD Pipeline (Cloudflare D1 & Pages/Workers)

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  quality-and-build:
    name: ۱. بررسی کد، TypeScript، تست و Build
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس‌کد از مخزن GitHub
        uses: actions/checkout@v4

      - name: راه‌اندازی محیط Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: بررسی صحت فایل‌های Migration دیتابیس D1
        run: |
          test -f migrations/0001_initial_schema.sql
          echo "Database migrations verified."

      - name: بررسی نوع‌ها و سینتکس TypeScript
        run: npm run lint

      - name: اجرای Build نهایی پروژه
        run: npm run build

  deploy-staging:
    name: ۲. استقرار خودکار در محیط آزمایشی (Staging)
    needs: quality-and-build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: اجرای Migration در دیتابیس آزمایشی Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dasteva_recruitment_staging --env staging --remote
      - name: استقرار در محیط Staging کلودفلر
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

  deploy-production:
    name: ۳. تأیید و استقرار در محیط عملیاتی (Production)
    needs: quality-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: پشتیبان‌گیری پیش از اجرای Migration محیط عملیاتی
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export dasteva_recruitment_prod --remote --output=backup-pre-deploy.sql
      - name: اجرای کنترل‌شده Migration در محیط تولید (Production D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dasteva_recruitment_prod --env production --remote
      - name: استقرار نهایی در Cloudflare Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
